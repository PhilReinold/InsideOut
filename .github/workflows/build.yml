name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.4-${{ runner.os }}

      - name: Configure
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build AU + VST3
        run: cmake --build build --config Release --target InsideOut_AU InsideOut_VST3 -- -quiet

      - name: Sign (ad-hoc)
        run: |
          codesign --force --deep -s - "build/InsideOut_artefacts/Release/AU/InsideOut.component"
          codesign --force --deep -s - "build/InsideOut_artefacts/Release/VST3/InsideOut.vst3"

      - name: Validate AU (auval)
        continue-on-error: true
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/InsideOut_artefacts/Release/AU/InsideOut.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 2
          auval -v aufx InsO PhJn

      - name: Package
        run: |
          mkdir -p dist
          cd build/InsideOut_artefacts/Release
          ditto -c -k --keepParent AU/InsideOut.component "$GITHUB_WORKSPACE/dist/InsideOut-AU.zip"
          ditto -c -k --keepParent VST3/InsideOut.vst3 "$GITHUB_WORKSPACE/dist/InsideOut-VST3.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: InsideOut-macOS
          path: dist/*

      - name: Release (on tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
